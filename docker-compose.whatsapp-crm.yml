services:
  whatsapp-crm-postgres:
    image: postgres:16-alpine
    container_name: melisa-whatsapp-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: melisa_whatsapp_crm
      POSTGRES_USER: melisa_crm
      POSTGRES_PASSWORD: melisa_crm_dev_password
    ports:
      - "5435:5432"
    volumes:
      - whatsapp_crm_postgres_data:/var/lib/postgresql/data
      - ./apps/whatsapp-crm-api/infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melisa_crm -d melisa_whatsapp_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  whatsapp-crm-redis:
    image: redis:7-alpine
    container_name: melisa-whatsapp-crm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - whatsapp_crm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: melisa-whatsapp-crm-evolution
    restart: unless-stopped
    depends_on:
      whatsapp-crm-postgres:
        condition: service_healthy
      whatsapp-crm-redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: change-me-local-only
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://melisa_crm:melisa_crm_dev_password@whatsapp-crm-postgres:5432/melisa_whatsapp_crm
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://whatsapp-crm-redis:6379
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:4200/webhooks/evolution
      WEBHOOK_GLOBAL_BY_EVENTS: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/manager || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  whatsapp_crm_postgres_data:
  whatsapp_crm_redis_data:
