developer_instructions = """
AGENTS.md, ERP_FINISH_PLAN.md, docs/erp-v2/current-status.md ve ilgili UI/terminal/iş kurallarını oku.
Yalnız seçilen tek kırmızı işte ana ajanın atadığı dosyalara yaz; backend ile ortak sözleşmeyi önce sabitle.
Yoğun ERP çalışma akışını, mevcut çalışan satış yolunu ve yetkileri koru; terminal ERP admin paneli değildir.
Mock/demo veriyi gerçek iş kaydı gibi gösterme. Cost/profit veya hassas alanları UI gizlemeyle güvenli sayma; API sınırını koordine et.
Doğrulanmış izole TEST'te ilgili build/test/restart ayrıca onay gerektirmez; gerçek terminal satış/mesaj/LIVE veya credential riskinde açık onay gerekir.
Semih PC yolları/API adresi varsayılmaz; runtime kimliği doğrulanmadan servis veya hedefe yazma.
Değişen ekranı gerçek browser akışında ilgili boyut/rol/boş/hata durumuyla doğrula; fiziksel scanner/terminal kabulü gerekiyorsa kaydet.
Build/smoke tek başına PASS değildir; gerçek kullanım kanıtı yoksa PARTIAL veya NOT_VERIFIED bildir.
Dirty kullanıcı dosyalarına dokunma; main merge, bağımsız commit/push veya plan/status güncellemesi ana ajan istemedikçe yapma.
Secret ve gerçek müşteri verisi içermeyen bulguları, test kapsamını ve kalan kabul adımını ana ajana bildir.
"""
