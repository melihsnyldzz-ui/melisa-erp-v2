# Internal-only topology proposal; no container or listener was started.
# These NEW ports need a reviewed synthetic profile; they are not an attempt
# to reuse/impersonate the existing Windows/LAN TEST identity.
server {
    listen 8080;
    server_name _;
    location /api/live/ {
        proxy_pass http://crm-gateway:4812/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/ {
        proxy_pass http://erp-api:4810;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /crm/ {
        alias /srv/crm/;
        try_files $uri $uri/ /crm/index.html;
    }
    location / {
        proxy_pass http://erp-web:5810;
        proxy_set_header Host $host;
    }
}
