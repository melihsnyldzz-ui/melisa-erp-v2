name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-startup-core:
    name: windows-startup-core
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Windows owner and single-instance startup boundaries
        run: node --test scripts/canonical/start-owned-test.test.mjs
      - name: Native Windows carton ACL module discovery
        run: node --test apps/api/src/services/cleanTerminalCartonDirectory.test.mjs
      - name: P03 Hub lineage PowerShell 5 source boundaries
        run: node --test scripts/canonical/p03-hub-lineage.test.mjs scripts/canonical/p03-light-hub.test.mjs
      - name: P03 physical recovery and isolated rehearsal source boundaries
        run: node --test scripts/canonical/p03-physical-profile-create.test.mjs scripts/canonical/p03-physical-recovery.test.mjs scripts/canonical/p03-rehearsal-harness.test.mjs scripts/canonical/p03-rehearsal-quiesce.test.mjs scripts/canonical/p03-rehearsal-partial-quiesce.test.mjs scripts/canonical/p03-pr54-invariance-compare.test.mjs scripts/canonical/p03-pr54-shared-owner-io.test.mjs scripts/canonical/p03-pr54-paused-old-recover.test.mjs scripts/canonical/p03-pr54-paused-console-recover.test.mjs scripts/canonical/p03-core-first-owner-transition.test.mjs scripts/canonical/p03-pr54-successor-core-drain.test.mjs scripts/canonical/p03-pr54-successor-empty.test.mjs scripts/canonical/p03-pr54-late-old-observe.test.mjs scripts/canonical/p03-pr54-new-owner-observe.test.mjs scripts/canonical/p03-observer-cim-order.test.mjs scripts/canonical/p03-pr54-receipt-acl.test.mjs scripts/canonical/p03-pr54-current-owner-io.test.mjs scripts/canonical/p03-pr54-current-successor.test.mjs scripts/canonical/p03-pr54-b264-successor.test.mjs scripts/canonical/p03-pr54-b264-owner-io.test.mjs scripts/canonical/p03-pr54-b264-physical-io.test.mjs scripts/canonical/p03-pr54-b264-shared-owner-transition.test.mjs scripts/canonical/p03-current-invariance-capture.test.mjs scripts/canonical/p03-pr54-reads-owner-cli.test.mjs scripts/canonical/p03-pr54-current-before-observation.test.mjs scripts/canonical/p03-pr54-new-owner-empty-recovery.test.mjs
      - name: Windows PowerShell 5 empty-port process probe with in-memory OS fixtures
        run: node scripts/ci/run.mjs windows-process-probe
      - name: P03 offline OLD PID diagnostics and private failure recorder
        run: node --test scripts/canonical/p03-old-reuse-diagnostic.test.mjs scripts/canonical/p03-old-reuse-failure-record.test.mjs
      - name: Current ERP CRM startup profile with in-memory settings and PS policy fixtures
        run: node --test scripts/canonical/p03-rehearsal-old-lifetime.test.mjs scripts/canonical/p03-rehearsal-original-task-restore.test.mjs scripts/canonical/p03-rehearsal-original-task-release.test.mjs scripts/canonical/p03-rehearsal-file-attributes.test.mjs scripts/canonical/p03-physical-noreparse-attributes.test.mjs scripts/canonical/p03-pr54-current-b007-helpers.test.mjs scripts/canonical/p03-pr54-current-b007-successor.test.mjs scripts/canonical/p03-pr54-current-b007-physical-io.test.mjs scripts/canonical/p03-pr54-current-b007-shared-owner.test.mjs scripts/canonical/p03-pr54-current-b007-admission-timing.test.mjs scripts/canonical/p03-pr54-same-admission-cut.test.mjs scripts/canonical/p03-pr54-current-protected-batch.test.mjs scripts/canonical/p03-pr54-current-b007-precut-continuation.test.mjs scripts/canonical/p03-pr54-current-b007-precut-cut.test.mjs scripts/canonical/p03-pr54-current-b007-precut-new-recovery.test.mjs scripts/canonical/p03-pr54-rehearsal-new-source-path.test.mjs scripts/canonical/p03-pr54-current-profile-cli.test.mjs scripts/canonical/crm06-current-package-profile.test.mjs scripts/canonical/terminal-completion-logon.test.mjs scripts/canonical/crm06-staff-journal-preflight.test.mjs scripts/canonical/wait-erp-for-hub.test.mjs scripts/canonical/crm06-unified-candidate.test.mjs
      - name: Current shared protection and immutable failed-run binding
        run: node --test scripts/canonical/p03-pr54-shared-protected-batch.test.mjs scripts/canonical/p03-pr54-current-pin-payload.test.mjs scripts/canonical/p03-pr54-current-b007-precut-d0-continuation.test.mjs
      - name: Clean backup preflight guards with offline PowerShell fixtures
        run: node --test scripts/canonical/goal6-restore-contract.test.mjs scripts/canonical/goal7-clean-backup.test.mjs
      - name: Fixed clean B5 pair transition with isolated source fixtures
        run: node --test scripts/canonical/clean-b5-pair-transition.test.mjs
      - name: Clean WEB owner birth and cooperative handoff on own temporary children
        run: node --test scripts/canonical/clean-web-owner.test.mjs
      - name: Clean WEB host adapter with pinned own temporary children
        run: node --test scripts/canonical/clean-web-host.test.mjs

  windows-b6-profile:
    name: windows-b6-profile
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: B6 finite native profile and rollback with isolated source fixtures
        run: node --test --test-concurrency=1 scripts/canonical/canonical-business-sale-maintenance.test.mjs scripts/canonical/prepare-business-sale-owner-bundle.test.mjs scripts/canonical/prepare-business-sale-array-repair-owner.test.mjs scripts/canonical/test125-bound-api-quiescence.test.mjs scripts/canonical/test125-bound-maintenance-plan.test.mjs scripts/canonical/start-owned-test-component.test.mjs scripts/canonical/start-business-5244-owned.test.mjs scripts/canonical/test125-read2b-pair.test.mjs

  windows-business-5244:
    name: windows-business-5244
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Business 5244 cooperative exclusion and owned native lifetime
        run: node --test --test-concurrency=1 scripts/canonical/business-5244-startup-exclusion.test.mjs scripts/canonical/start-business-5244-web.test.mjs scripts/canonical/business-5244-retirement-channel.test.mjs scripts/canonical/business-5244-retirement-state.test.mjs scripts/canonical/business-5244-maintenance-dispatch.test.mjs scripts/canonical/business-5244-maintenance-commit.test.mjs scripts/canonical/business-5244-paired-maintenance.test.mjs scripts/canonical/business-5244-readpair-router.test.mjs scripts/canonical/business-5244-readpair-install.test.mjs scripts/canonical/business-5244-managed-cancel.test.mjs scripts/canonical/test125-read2b-prepared-api.test.mjs scripts/canonical/business-5244-readpair-admission.test.mjs

  # Keep the required check name and reject every unsuccessful shard result.
  windows-startup-test:
    name: windows-startup-test
    needs: [windows-startup-core, windows-b6-profile, windows-business-5244]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Require every Windows test group to succeed
        shell: pwsh
        env:
          CORE_RESULT: ${{ needs.windows-startup-core.result }}
          B6_RESULT: ${{ needs.windows-b6-profile.result }}
          BUSINESS_RESULT: ${{ needs.windows-business-5244.result }}
        run: |
          foreach ($result in @($env:CORE_RESULT, $env:B6_RESULT, $env:BUSINESS_RESULT)) {
            if ($result -cne 'success') {
              throw 'WINDOWS_TEST_GROUP_NOT_SUCCESS'
            }
          }

  quality-build-test:
    name: quality-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web-admin/package-lock.json
            apps/sites-workflow/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/web-admin --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/sites-workflow --ignore-scripts --no-audit --no-fund
      - name: Verify the offline boundary
        run: node scripts/ci/run.mjs guard
      - name: JavaScript syntax and basic quality
        run: node scripts/ci/run.mjs quality
      - name: API unit tests with synthetic boundaries
        run: node scripts/ci/run.mjs api
      - name: Web admin calculation tests
        run: node scripts/ci/run.mjs web-admin
      - name: Sites workflow unit tests
        run: node scripts/ci/run.mjs sites-workflow
      - name: Migration models with synthetic data only
        run: node scripts/ci/run.mjs migration
      - name: Canonical SQL source checks without SQL access
        run: node scripts/ci/run.mjs canonical
      - name: Build web admin and Sites workflow
        run: node scripts/ci/run.mjs build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Scan reachable history with pinned Gitleaks and masked findings
        run: bash scripts/ci/scan-secrets.sh
