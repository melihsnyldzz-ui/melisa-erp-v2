name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-startup-test:
    name: windows-startup-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Windows owner and single-instance startup boundaries
        run: node --test scripts/canonical/start-owned-test.test.mjs
      - name: P03 Hub lineage PowerShell 5 source boundaries
        run: node --test scripts/canonical/p03-hub-lineage.test.mjs scripts/canonical/p03-light-hub.test.mjs
      - name: P03 physical recovery and isolated rehearsal source boundaries
        run: node --test scripts/canonical/p03-physical-profile-create.test.mjs scripts/canonical/p03-physical-recovery.test.mjs scripts/canonical/p03-rehearsal-harness.test.mjs scripts/canonical/p03-rehearsal-quiesce.test.mjs scripts/canonical/p03-rehearsal-partial-quiesce.test.mjs scripts/canonical/p03-pr54-invariance-compare.test.mjs scripts/canonical/p03-pr54-shared-owner-io.test.mjs scripts/canonical/p03-pr54-paused-old-recover.test.mjs scripts/canonical/p03-pr54-paused-console-recover.test.mjs scripts/canonical/p03-core-first-owner-transition.test.mjs scripts/canonical/p03-pr54-successor-core-drain.test.mjs scripts/canonical/p03-pr54-successor-empty.test.mjs scripts/canonical/p03-pr54-late-old-observe.test.mjs scripts/canonical/p03-pr54-new-owner-observe.test.mjs scripts/canonical/p03-observer-cim-order.test.mjs scripts/canonical/p03-pr54-receipt-acl.test.mjs scripts/canonical/p03-pr54-current-owner-io.test.mjs scripts/canonical/p03-pr54-current-successor.test.mjs scripts/canonical/p03-current-invariance-capture.test.mjs scripts/canonical/p03-pr54-reads-owner-cli.test.mjs scripts/canonical/p03-pr54-current-before-observation.test.mjs scripts/canonical/p03-pr54-new-owner-empty-recovery.test.mjs
      - name: Windows PowerShell 5 empty-port process probe with in-memory OS fixtures
        run: node scripts/ci/run.mjs windows-process-probe
  quality-build-test:
    name: quality-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web-admin/package-lock.json
            apps/sites-workflow/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --prefix apps/api --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/web-admin --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/sites-workflow --ignore-scripts --no-audit --no-fund
      - name: Verify the offline boundary
        run: node scripts/ci/run.mjs guard
      - name: JavaScript syntax and basic quality
        run: node scripts/ci/run.mjs quality
      - name: API unit tests with synthetic boundaries
        run: node scripts/ci/run.mjs api
      - name: Web admin calculation tests
        run: node scripts/ci/run.mjs web-admin
      - name: Sites workflow unit tests
        run: node scripts/ci/run.mjs sites-workflow
      - name: Migration models with synthetic data only
        run: node scripts/ci/run.mjs migration
      - name: Canonical SQL source checks without SQL access
        run: node scripts/ci/run.mjs canonical
      - name: Build web admin and Sites workflow
        run: node scripts/ci/run.mjs build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Scan reachable history with pinned Gitleaks and masked findings
        run: bash scripts/ci/scan-secrets.sh
