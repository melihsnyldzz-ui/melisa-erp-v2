.sale-table tr{display:grid;grid-template-columns:minmax(0,1fr) 54px 70px 44px;gap:4px;align-items:center;padding:8px 4px;margin:0;border:0;border-bottom:1px solid #ffffff26;border-radius:0;background:transparent;min-height:78px}
.sale-table .sale-product{grid-column:auto;min-width:0;padding-right:0!important;line-height:1.25}
.sale-product b{display:block;font-size:14px;font-weight:650;overflow-wrap:anywhere}
.sale-product br{display:none}.sale-product>small{font-size:12px;color:#b9cec2}
.sale-row-meta{display:block;font-size:12px;color:#b9cec2;margin-top:2px;line-height:1.25}
.sale-table td[data-label="Örnek stok"],.sale-table td[data-label="Birim fiyat"]{display:none}
.sale-table td[data-label="Miktar"]::before,.sale-table td[data-label="Tutar"]::before{display:none}
.sale-table td[data-label="Tutar"]{text-align:right;font-size:14px!important;white-space:normal}
.sale-table td[data-label="Tutar"] b{font-weight:650}
.sale-table input{width:54px!important;min-height:44px;padding:6px;text-align:center}
.sale-table .sale-remove{position:static;justify-self:end}
.sale-table .sale-remove button{padding:0;width:44px;height:44px;background:transparent;color:#c5dace;border:0;font-size:22px}
.terminal-device .sale-table tr{padding:8px 0;gap:4px}
.terminal-device .termhead{margin-bottom:6px}.terminal-device .termhead small{display:none}
.terminal-device .sale-fields label{display:flex;align-items:center;gap:8px;font-size:14px}.terminal-device .sale-fields select{flex:1;min-width:0}
.terminal-device .sale-fields{margin-bottom:6px}.terminal-device .sale-feedback{min-height:20px;font-size:12px}
.terminal-device .sale-footer .total{font-size:20px}.terminal-device .sale-footer{padding-top:7px}
}
.receipt-type-box{flex:none;background:#ffffff0c;border:1px solid #ffffff25;padding:10px;border-radius:8px;margin-bottom:8px}.receipt-type-box>strong{font-size:14px}.receipt-type-box>div{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:120px;overflow:auto;margin:6px 0}.receipt-type-box span{font-size:13px;display:flex;gap:6px}.receipt-type-box small{font-size:12px;color:#bed2c6}</style>
