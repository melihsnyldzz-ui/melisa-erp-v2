<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST · Ekran görünüm kontrolü</title>
<style>body{margin:0;background:#edf3ef;color:#17372d;font:15px system-ui,sans-serif}header{padding:16px 20px;background:#fff;border-bottom:1px solid #ccded3;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 12px 0 0}button,select,a{font:inherit;min-height:42px;padding:8px 14px;border:1px solid #afc7b9;border-radius:7px;background:white;color:#17372d;box-sizing:border-box}button[aria-pressed=true]{background:#176b50;color:white}button{cursor:pointer}a{display:inline-flex;align-items:center;text-decoration:none}main{padding:18px}#status{margin:0 0 12px;color:#456453}#stage{position:relative;width:100%;overflow:hidden;background:white;border:1px solid #cbded2;border-radius:9px;box-sizing:border-box}iframe{display:block;border:0;transform-origin:top left;position:absolute;top:0;left:0}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #86c8a5;outline-offset:2px}</style></head>
<body><header><h1>TEST ekran görünümü</h1><button data-width="1440" aria-pressed="true">1440 px</button><button data-width="1024" aria-pressed="false">1024 px</button><button data-width="390" aria-pressed="false">390 px</button><label>Ekran <select id="screen"><option value="purchases">Alış</option><option value="prices">Fiyat &amp; maliyet</option><option value="customers">Müşteriler</option></select></label><a id="normal" href="is-akisi-taslagi.html#purchases">Normal ekranı aç</a></header><main><p id="status" aria-live="polite"></p><div id="stage"><iframe title="ERP TEST çalışma ekranı" src="is-akisi-taslagi.html#purchases" width="1440" height="960"></iframe></div></main>
<script type="module">
const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),status=document.querySelector('#status');let width=1440;
function size(){const available=stage.clientWidth,scale=Math.min(1,available/width);frame.width=String(width);frame.style.width=width+'px';frame.style.height='960px';frame.style.transform=`scale(${scale})`;stage.style.height=Math.ceil(960*scale)+'px';status.textContent=`Çalışma ekranının genişliği: ${width} px · Görüntü ölçeği: %${Math.round(scale*100)} · Aynı TEST ekranı ve oturum.`;}
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{width=Number(button.dataset.width);document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));size();}));
document.querySelector('#screen').addEventListener('change',event=>{const screen=event.target.value;if(!['purchases','prices','customers'].includes(screen))return;frame.src='is-akisi-taslagi.html#'+screen;document.querySelector('#normal').href=frame.src;});
new ResizeObserver(size).observe(stage);size();
</script></body></html>
